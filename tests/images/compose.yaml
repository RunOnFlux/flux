# The unit suite in containers of its own, as CI runs it. Started through
# run-unit.sh, which names each run's project, so concurrent runs share no
# container, network or volume. Docker is a daemon of the run's own (dind):
# the suite's Docker tests never reach the host's.
services:
  dind:
    image: docker:27.5.1-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 5s
      retries: 30
    labels:
      com.runonflux.container_type: "fluxos_test"
  mongo:
    # CI's version (.github/workflows/nodejs.yml)
    image: "mongo:7.0@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4"
    init: true
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30
    labels:
      com.runonflux.container_type: "fluxos_test"
  tester:
    build: .
    image: runonflux/testerimage:latest
    init: true
    depends_on:
      dind:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://dind:2375
      CI: "true"
    # not quite sure about this yet, but think it's necessary for iptables (probably should be mocked)
    cap_add:
      - net_admin
    volumes:
      - ../../:/home/fluxtesting/flux
    labels:
      com.runonflux.container_type: "fluxos_test"
    profiles: [auto]
