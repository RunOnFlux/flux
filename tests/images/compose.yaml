# The unit suite in containers of its own, as CI runs it. Started through
# run-unit.sh, which names each run's project, so concurrent runs share no
# image, container, network or volume. No unit test asks a docker daemon, so
# there is none.
services:
  mongo:
    # CI's version (.github/workflows/nodejs.yml)
    image: "mongo:7.0@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4"
    init: true
    # Its data in memory: a collection or index the suite creates does not wait on
    # the host's disk, however busy the host is.
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30
    labels:
      com.runonflux.container_type: "fluxos_test"
  tester:
    # Built as this run's own image (<project>-tester), removed with the run.
    build: .
    init: true
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      CI: "true"
    # not quite sure about this yet, but think it's necessary for iptables (probably should be mocked)
    cap_add:
      - net_admin
    volumes:
      - ../../:/home/fluxtesting/flux
    labels:
      com.runonflux.container_type: "fluxos_test"
    profiles: [auto]
